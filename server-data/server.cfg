# ═════════════════════════════════════════════════════════════
#   Mars Community 2  –  تنظیمات اصلی سرور
#   پلتفرم: VMP   |   فریم‌ورک: QBox (سازگار با اسکریپت‌های QBCore)
#   پایه: Qbox txAdminRecipe (qbox-stable) + تغییرات مخصوص VMP
# ═════════════════════════════════════════════════════════════

# ── شبکه ──
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ── اطلاعات محرمانه: لایسنس، کلید Steam، رمز دیتابیس (ساخته‌شده توسط install.bat) ──
exec secrets.cfg

# ── مشخصات سرور ──
sv_hostname "Mars Community 2 | مارس کامیونیتی ۲"
sets sv_projectName "Mars Community 2"
sets sv_projectDesc "Roleplay Server"
sets locale "fa-IR"
sets tags "roleplay, qbox, iran, persian"
sv_maxclients 64

# نسخه‌ی بیلد بازی – بعد از اولین اجرا روی VMP مشخص می‌کنیم (Qbox پیش‌فرض: 3258)
# sv_enforceGameBuild 3258

# ── هویت بازیکن در VMP (mars_identity) ──
# اگر بازیکن لایسنس راک‌استار نداشت، از این شناسه‌ها (به ترتیب) استفاده می‌شود
set mars:identityShim "true"
set mars:licenseFallback "steam,discord,fivem,xbl,live"
set mars:logIdentifiers "true"

# ── چت ──
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s وارد سرور شد"
set qbx_chat:quitMessage "^1%s از سرور خارج شد (%s)"

# ── صدا ──
exec voice.cfg

# ── تنظیمات QBox ──
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink ""
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "true"
setr qbx:enableGroupManagement "false"
setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'><span style='color: rgb(160, 110, 255);'>به Mars Community 2 خوش آمدید!</span></p>"

setr illenium-appearance:locale "en"
setr weather_disablecd true

# ── تنظیمات ox ──
exec ox.cfg

# ── صفحه‌ی لودینگ ──
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#8b5cf6"
set loadscreen:shadowColor "#1a07187f"

# ── ریسورس‌ها (ترتیب مهم است) ──
ensure mapmanager
ensure spawnmanager
ensure baseevents

ensure mars_identity
ensure oxmysql
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [mars]

# ── دسترسی‌ها و ادمین‌ها ──
exec permissions.cfg
# بعد از اولین ورود، شناسه‌ی شما را از لاگ برمی‌داریم و اینجا می‌گذاریم:
# add_principal identifier.steam:XXXXXXXX group.admin

# ── متفرقه ──
exec misc.cfg
