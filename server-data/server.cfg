# ═════════════════════════════════════════════════════════════
#   Mars Community 2  –  تنظیمات اصلی سرور
#   پلتفرم: VMP   |   فریم‌ورک: QBox (سازگار با اسکریپت‌های QBCore)
# ═════════════════════════════════════════════════════════════

# ── شبکه ──
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ── اطلاعات محرمانه (کلیدها و رمز دیتابیس) ──
exec secrets.cfg

# ── مشخصات سرور ──
sv_hostname "Mars Community 2 | مارس کامیونیتی ۲"
sets sv_projectName "Mars Community 2"
sets sv_projectDesc "Roleplay Server"
sets locale "fa-IR"
sets tags "roleplay, qbox, iran, persian"

# تعداد بازیکن – برای شروع ۶۴، با ارتقای سرور بالا می‌بریم
sv_maxclients 64

# ── امنیت پایه ──
sv_scriptHookAllowed 0
# نسخه‌ی بیلد بازی – بعد از اینکه نسخه‌ی VMP را دیدیم مشخص می‌کنیم
# sv_enforceGameBuild 3095

# ── ریسورس‌های پیش‌فرض پلتفرم ──
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap

# ── فریم‌ورک (در مرحله ۱ فعال می‌شود – ترتیب مهم است) ──
# ensure oxmysql
# ensure ox_lib
# ensure qbx_core
# ensure ox_target
# ensure ox_inventory
# ensure [qbx]
# ensure [mars]        # اسکریپت‌های اختصاصی مارس کامیونیتی

# ── ادمین‌ها (در مرحله ۱ شناسه‌ی خودتان را اینجا می‌گذاریم) ──
# add_principal identifier.steam:XXXXXXXX group.admin
