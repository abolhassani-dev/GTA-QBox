# ═════════════════════════════════════════════════════════════
#   Mars Community 2  –  تنظیمات اصلی سرور
#   پلتفرم: VMP   |   فریم‌ورک: QBox (سازگار با اسکریپت‌های QBCore)
#   پایه: Qbox txAdminRecipe (qbox-stable) + تغییرات مخصوص VMP
# ═════════════════════════════════════════════════════════════

# ── شبکه ──
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ── اطلاعات محرمانه: لایسنس، کلید Steam، رمز دیتابیس (ساخته‌شده توسط install.bat) ──
exec secrets.cfg

# ── مشخصات سرور ──
sv_hostname "Mars Community 2"
sets sv_projectName "Mars Community 2"
sets sv_projectDesc "Roleplay Server"
sets locale "en-US"
sets tags "roleplay, qbox, iran, persian"
sv_maxclients 64

# نسخه‌ی بیلد بازی – بعد از اولین اجرا روی VMP مشخص می‌کنیم (Qbox پیش‌فرض: 3258)
# sv_enforceGameBuild 3258

# ── هویت بازیکن در VMP (mars_identity) ──
# اگر بازیکن لایسنس راک‌استار نداشت، از این شناسه‌ها (به ترتیب) استفاده می‌شود
set mars:identityShim "true"
# ⚠️ «ip» فقط برای تست در شبکه‌ی گیم‌نت است؛ قبل از عمومی کردن سرور حذفش کنید
set mars:licenseFallback "steam,discord,fivem,xbl,live,token,ip"
set mars:logIdentifiers "true"

# ── چت ──
# چت اختصاصی mars_chat (در پوشه‌ی [mars]) جای چت پیش‌فرض را می‌گیرد
set resources_useSystemChat false
set qbx_chat:joinMessage "^2%s joined the server"
set qbx_chat:quitMessage "^1%s left the server (%s)"

# ── صدا ──
exec voice.cfg

# ── تنظیمات QBox ──
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink ""
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "true"
setr qbx:enableGroupManagement "false"
setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'><span style='color: rgb(160, 110, 255);'>Welcome to Mars Community 2!</span></p>"

setr illenium-appearance:locale "en"
setr weather_disablecd true

# ── گوشی (npwd) ──
set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# ── تنظیمات ox ──
exec ox.cfg

# ── صفحه‌ی لودینگ ──
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#8b5cf6"
set loadscreen:shadowColor "#1a07187f"

# ── ریسورس‌ها (ترتیب مهم است) ──
ensure mapmanager
ensure spawnmanager
ensure baseevents

ensure mars_identity
ensure oxmysql
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [qbx-jobs]
ensure [qbx-crime]

# phone (npwd) – order matters
ensure screencapture
ensure npwd_qbx_mail
ensure qbx_npwd
ensure npwd

ensure [mars]

# ── دسترسی‌ها و ادمین‌ها ──
exec permissions.cfg
# کسی که روی خودِ کامپیوترِ سرور بازی می‌کند (connect 127.0.0.1:30120) ادمین است.
# این امن است: فقط از روی همان سیستم می‌شود با آی‌پی 127.0.0.1 وصل شد.
add_principal identifier.ip:127.0.0.1 group.admin
# ادمین با Citizen ID (از لاگ سرور: «(Citizen ID: XXXXXXXX ...) has successfully loaded!»)
# چند نفر را با کاما جدا کنید، مثلاً "G2NRW24I,ABCD1234"
set mars:admins "G2NRW24I"
add_ace resource.mars_identity command.add_principal allow
add_ace resource.mars_identity command.remove_principal allow

# ── متفرقه ──
exec misc.cfg
