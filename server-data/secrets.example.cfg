# ─────────────────────────────────────────────────────────────
#  این فایل نمونه است. یک کپی از آن با نام secrets.cfg بسازید
#  و مقادیر واقعی را داخلش بنویسید. secrets.cfg در گیت آپلود نمی‌شود.
# ─────────────────────────────────────────────────────────────

# کلید لایسنس سرور VMP (از سایت vmp.ir) – در مرحله ۱ دقیق می‌گیریم
sv_licenseKey "PUT_YOUR_VMP_LICENSE_KEY_HERE"

# کلید Steam Web API (برای شناسایی بازیکن‌ها، چون لایسنس راک‌استار در VMP نیست)
# دریافت از: https://steamcommunity.com/dev/apikey
set steam_webApiKey "PUT_YOUR_STEAM_API_KEY_HERE"

# اتصال به دیتابیس MariaDB که روی همان سرور نصب می‌شود
set mysql_connection_string "mysql://marsuser:PUT_DB_PASSWORD_HERE@127.0.0.1/mars_community?charset=utf8mb4"
